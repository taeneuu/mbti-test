<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독립의 길, 나의 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&family=Gowun+Batang&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECE1C4;
    --paper2:#E2D3A9;
    --paper3:#D9C793;
    --ink:#2A2318;
    --ink-soft:#655A46;
    --ink-faint:#8A7D63;
    --red:#9B2C1E;
    --red-dark:#711F15;
    --indigo:#2C3F52;
    --gold:#93701F;
    --rule:#C3B183;
    --shadow:rgba(35,28,16,.22);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Noto Serif KR', serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.25), transparent 55%),
      radial-gradient(ellipse at 90% 90%, rgba(0,0,0,.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.015) 0px, rgba(0,0,0,.015) 1px, transparent 1px, transparent 3px),
      var(--paper);
    line-height:1.62;
  }
  a{color:inherit;}
  #app{max-width:720px;margin:0 auto;padding:20px 18px 80px;}
  ::selection{background:var(--red);color:var(--paper);}

  /* ---------- masthead ---------- */
  .masthead{
    border-top:4px double var(--ink);
    border-bottom:4px double var(--ink);
    padding:10px 2px 12px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:20px;
    gap:12px;
  }
  .masthead .m-left{font-family:'Courier New',monospace;font-size:12px;letter-spacing:.14em;color:var(--ink-soft);}
  .masthead h1{
    font-size:clamp(20px,5vw,27px);
    margin:2px 0 0;
    font-weight:900;
    letter-spacing:.02em;
  }
  .masthead .m-right{text-align:right;font-family:'Courier New',monospace;font-size:12px;color:var(--ink-soft);letter-spacing:.08em;}
  .masthead .m-right b{display:block;font-size:16px;color:var(--ink);font-weight:700;letter-spacing:0;}

  /* ---------- progress dots ---------- */
  .progress{display:flex;gap:6px;justify-content:center;margin:0 0 8px;flex-wrap:wrap;}
  .progress span{
    width:7px;height:7px;border-radius:50%;
    background:var(--rule);
    transition:background .3s, transform .3s;
  }
  .progress span.done{background:var(--red);}
  .progress span.now{background:var(--ink);transform:scale(1.4);}
  .progress span.chapter-gap{width:14px;height:1px;background:transparent;}
  .chapter-label{
    text-align:center;font-family:'Courier New',monospace;font-size:11.5px;
    color:var(--ink-faint);letter-spacing:.1em;margin:0 0 18px;
  }

  /* ---------- eyebrow / titles ---------- */
  .eyebrow{
    font-family:'Courier New',monospace;
    font-size:12px;
    letter-spacing:.16em;
    color:var(--red-dark);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .scene-title{font-size:clamp(18px,4.4vw,23px);font-weight:700;margin:0 0 4px;}
  .scene-year{font-size:13px;color:var(--ink-faint);margin-bottom:14px;font-style:italic;}

  /* ---------- scene card ---------- */
  .scene-card{
    background:var(--paper2);
    border:1px solid var(--rule);
    padding:20px 20px 22px;
    box-shadow:0 10px 24px -14px var(--shadow);
    margin-bottom:20px;
  }
  .scene-card p{margin:0 0 12px;font-size:15.5px;}
  .scene-card p:last-child{margin-bottom:0;}

  /* ---------- choice grid ---------- */
  .choices{display:grid;gap:11px;}
  .choice{
    display:block;
    text-align:left;
    background:var(--paper);
    border:2px solid var(--rule);
    padding:15px 17px;
    cursor:pointer;
    font-family:inherit;
    color:inherit;
    font-size:15px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
  }
  .choice:hover{transform:translateY(-2px);box-shadow:0 10px 18px -12px var(--shadow);border-color:var(--gold);}
  .choice:active{transform:translateY(0);}
  .choice:focus-visible{outline:3px solid var(--red-dark);outline-offset:2px;}
  .choice .c-body b{display:block;font-size:15.5px;margin-bottom:4px;font-weight:600;}
  .choice .c-body span{color:var(--ink-soft);font-size:13.5px;}
  .choice.selected{border-color:var(--red);background:#F1E6C6;box-shadow:0 0 0 1px var(--red) inset;}
  .choice.selected .c-body b::after{content:' ✓';color:var(--red-dark);}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-block;
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:15px;
    padding:12px 26px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    cursor:pointer;
    letter-spacing:.02em;
    transition:background .15s, transform .15s, opacity .15s;
  }
  .btn:hover{background:var(--red-dark);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:3px solid var(--red);outline-offset:2px;}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  .btn.secondary:hover{background:var(--ink);color:var(--paper);}
  .btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
  .nav-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;}
  .nav-row .spacer{flex:1;}
  .center{text-align:center;}

  /* ---------- intro ---------- */
  .lede{font-size:16px;margin:0 0 14px;}
  .disclaimer{
    font-size:12.5px;
    color:var(--ink-faint);
    border:1px dashed var(--rule);
    padding:10px 12px;
    margin:16px 0 22px;
    line-height:1.5;
  }
  .id-form{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 6px;}
  .id-form .id-field{flex:1;min-width:130px;}
  .id-form label{display:block;font-family:'Courier New',monospace;font-size:11.5px;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:5px;}
  .id-form input{
    width:100%;font-family:inherit;font-size:14.5px;
    padding:10px 11px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);
  }
  .id-form input:focus-visible{outline:3px solid var(--red-dark);outline-offset:1px;}
  .id-form-error{color:var(--red-dark);font-size:12.5px;min-height:16px;margin:0 0 16px;}

  /* ---------- stamp overlay ---------- */
  #stampOverlay{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:60;opacity:0;
  }
  #stampOverlay.show{animation:stampIn .7s ease forwards;}
  .stamp{
    width:112px;height:112px;border-radius:50%;
    border:5px double var(--red);
    display:flex;align-items:center;justify-content:center;
    color:var(--red);font-size:14px;font-weight:700;letter-spacing:.06em;
    background:rgba(236,225,196,.85);
    transform:rotate(-11deg) scale(1.5);
    text-align:center;
    box-shadow:0 0 0 3px rgba(155,44,30,.15);
  }
  @keyframes stampIn{
    0%{opacity:0;}
    18%{opacity:1;}
    22%{transform:scale(1);}
    70%{opacity:1;}
    100%{opacity:0;}
  }
  #stampOverlay.show .stamp{animation:stampPunch .7s ease forwards;}
  @keyframes stampPunch{
    0%{transform:rotate(-11deg) scale(1.9);}
    20%{transform:rotate(-11deg) scale(1);}
    75%{transform:rotate(-11deg) scale(1);}
    100%{transform:rotate(-11deg) scale(1);}
  }

  /* ---------- results ---------- */
  .result-headline{text-align:center;margin:6px 0 22px;}
  .result-headline .r-eyebrow{font-family:'Courier New',monospace;font-size:12px;letter-spacing:.16em;color:var(--ink-soft);}
  .result-headline h2{font-size:clamp(22px,6vw,30px);margin:8px 0;font-weight:900;color:var(--red-dark);}
  .result-headline p{max-width:500px;margin:0 auto;font-size:14.5px;color:var(--ink-soft);}

  .bars-label{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.12em;color:var(--gold);margin:0 0 10px;}
  .bars{margin:0 0 20px;}
  .bar-row{margin-bottom:14px;}
  .bar-row .b-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .bar-row .b-top b{font-weight:700;}
  .bar-track{height:11px;background:var(--paper3);border:1px solid var(--rule);}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--indigo),var(--red-dark));transition:width .9s ease;}

  .figure-card{
    background:var(--paper2);border:1px solid var(--gold);
    padding:16px 18px 16px;margin:18px 0;
    display:flex;gap:14px;align-items:flex-start;
  }
  .figure-card .f-portrait{
    flex:0 0 auto;width:64px;height:64px;border-radius:50%;
    border:2px solid var(--gold);object-fit:cover;background:var(--paper3);
  }
  .figure-card .f-portrait.f-portrait-fallback{
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif KR',serif;font-weight:700;font-size:22px;color:var(--gold);
  }
  .figure-card .f-body{flex:1;min-width:0;}
  .figure-card .f-kicker{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.12em;color:var(--gold);margin-bottom:6px;}
  .figure-card h3{margin:0 0 4px;font-size:19px;}
  .figure-card .f-years{font-size:12px;color:var(--ink-faint);margin-bottom:8px;}
  .figure-card p{font-size:14px;margin:0;}

  .reflect-box{margin:22px 0 6px;}
  .reflect-label{font-weight:700;font-size:14.5px;margin:0 0 8px;display:flex;align-items:center;gap:6px;}
  .reflect-label .tag{font-size:11px;font-family:'Courier New',monospace;color:var(--paper);background:var(--indigo);padding:2px 7px;letter-spacing:.04em;}
  textarea.reflect{
    width:100%;font-family:inherit;font-size:14.5px;line-height:1.55;
    padding:12px 13px;border:1px solid var(--rule);background:var(--paper);
    resize:vertical;min-height:80px;color:var(--ink);
  }
  textarea.reflect:focus-visible{outline:3px solid var(--red-dark);outline-offset:1px;}
  textarea.reflect::placeholder{color:var(--ink-faint);}

  /* ---------- reading material (인물 카드와 분리된 독립 박스) ---------- */
  .reading-box{
    background:var(--paper3);border:1px dashed var(--indigo);
    padding:14px 16px 15px;margin:10px 0 18px;
  }
  .reading-box .r-label{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.12em;color:var(--indigo);margin-bottom:7px;}
  .reading-box blockquote{margin:0 0 7px;padding:2px 0 2px 13px;border-left:3px solid var(--indigo);font-size:13.5px;line-height:1.65;color:var(--ink);font-style:italic;}
  .reading-box .r-source{font-size:12px;color:var(--ink-faint);text-align:right;}

  /* ---------- submit ---------- */
  .btn-wide{display:block;width:100%;text-align:center;padding:15px 20px;font-size:16px;margin-top:26px;}
  .small-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;}
  .btn-small{font-size:13px;padding:8px 16px;}
  .submit-status{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:8px;min-height:16px;}

  .bridge{
    margin-top:24px;padding:14px 16px;border-left:3px solid var(--gold);
    background:var(--paper2);font-size:14px;color:var(--ink-soft);
  }

  /* ---------- section labels (결과 화면 구획) ---------- */
  .sec-label{
    font-family:'Courier New',monospace;font-size:11px;letter-spacing:.14em;
    color:var(--gold);margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--rule);
  }
  .sec-label:first-of-type{margin-top:0;padding-top:0;border-top:none;}

  /* ---------- 선택 직후 서사적 피드백 ---------- */
  .choice-feedback{
    background:var(--paper3);border:1px dashed var(--gold);
    padding:12px 14px 13px;margin:2px 0 18px;font-size:13px;color:var(--ink-soft);
    animation:fbIn .35s ease;
  }
  .choice-feedback .fb-line{margin:0 0 4px;line-height:1.5;}
  .choice-feedback .fb-line:last-child{margin-bottom:0;}
  .choice-feedback .fb-gain b{color:var(--indigo);font-weight:700;}
  .choice-feedback .fb-lose b{color:var(--red-dark);font-weight:700;}
  @keyframes fbIn{ from{opacity:0;transform:translateY(-4px);} to{opacity:1;transform:translateY(0);} }

  /* ---------- 선택 분석 문단 ---------- */
  .analysis-box{
    background:var(--paper2);border:1px solid var(--rule);
    padding:16px 18px;margin:0 0 20px;font-size:14.5px;line-height:1.7;
  }
  .analysis-box p{margin:0 0 8px;}
  .analysis-box p:last-child{margin-bottom:0;}

  /* ---------- 인물 연결 문장 ---------- */
  .figure-card .f-link{
    font-size:13px;color:var(--ink-soft);margin:0 0 8px;padding:8px 10px;
    background:var(--paper3);border-left:2px solid var(--gold);font-style:italic;
  }

  /* ---------- 챕터 전환 화면 ---------- */
  .chapter-end{
    text-align:center;padding:52px 10px 40px;
  }
  .chapter-end .ce-year{
    font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(38px,12vw,58px);
    color:var(--rule);letter-spacing:.03em;margin:0 0 22px;
  }
  .chapter-end .ce-line{font-size:16px;margin:0 0 10px;line-height:1.75;color:var(--ink);}
  .chapter-end .ce-line.quote{color:var(--red-dark);font-weight:700;margin-top:18px;}
  .chapter-end .ce-rule{width:44px;height:2px;background:var(--gold);margin:22px auto;}

  /* ---------- 12번 문항: 마지막 가방 ---------- */
  .bag-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;}
  .bag-item{
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
    padding:16px 8px 14px;
  }
  .bag-item .b-icon{font-size:30px;line-height:1;}
  .bag-item .c-body{display:contents;}
  .bag-item .c-body b{font-size:13.5px;margin:0;}
  .bag-item .c-body span{font-size:11.5px;}
  .bag-toast{
    text-align:center;font-size:13.5px;color:var(--red-dark);font-weight:700;
    margin:2px 0 18px;min-height:18px;animation:fbIn .35s ease;
  }

  /* ---------- 제출 확인 카드 ---------- */
  .submit-confirm{
    display:flex;align-items:center;gap:12px;
    background:var(--paper2);border:1px solid var(--gold);
    padding:16px 18px;margin-top:14px;
  }
  .submit-confirm .sc-mark{
    flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--red-dark);
    color:var(--red-dark);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;
  }
  .submit-confirm .sc-body b{display:block;font-size:14.5px;margin-bottom:2px;}
  .submit-confirm .sc-body span{font-size:12.5px;color:var(--ink-soft);}

  footer.credit{text-align:center;font-size:11.5px;color:var(--ink-faint);margin-top:36px;font-family:'Courier New',monospace;letter-spacing:.04em;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="stampOverlay"><div class="stamp">선<br>택</div></div>

<script>
/* ============================ DATA ============================ */

// 다섯 개의 노선. 매 문항은 이 중 두 노선을 맞세운 2지선다이고,
// 화면에는 노선 이름이 드러나지 않는다 — 학생은 그냥 둘 중 하나를 고를 뿐이다.
// 선택할 때마다 고른 노선에 +3, 역사적으로 맞닿아 있는 인접 노선에 +1이 뒤에서 누적된다.
// (선택지 개수 = 2, 결과의 종류 = 5 : 이 둘을 분리하는 것이 이 활동의 핵심 설계)
const ROUTES = {
  sil:     { label:'실력양성' },
  oe:      { label:'외교독립' },
  daejung: { label:'대중운동' },
  mujang:  { label:'무장투쟁' },
  uiyeol:  { label:'의열투쟁' },
};
// 주 노선을 골랐을 때 함께 살짝 오르는 인접 노선(역사적 연관성에 따른 설계).
// 5개 노선이 순환 구조로 정확히 1곳씩만 주고 1곳씩만 받도록 구성해,
// 특정 노선(예: 대중운동)만 두 곳에서 중복으로 보너스를 받는 쏠림을 없앴다.
const SECONDARY = { sil:'oe', oe:'daejung', daejung:'mujang', mujang:'uiyeol', uiyeol:'sil' };

// 결과 화면의 '선택 분석' 문단에서 노선 이름 대신 쓰는 서사적 표현.
const ROUTE_PICK_PHRASE = {
  sil:'차근차근 힘을 기르는', oe:'세계에 호소하는', daejung:'사람들을 모으는',
  mujang:'조직적으로 맞서는', uiyeol:'직접 행동에 나서는',
};

// 단원 도입 활동이므로, 아직 배우지 않은 1920년대 구체적 사건명은 직접 언급하지 않는다.
// 선택지도 이념을 그대로 말하지 않고, 장면 속 반응으로 은근하게 갈리도록 구성했다.
// 매 문항은 5개 노선 중 두 개를 맞세운 2지선다이며, 10문항에 걸쳐 5C2 = 10개 조합이 모두 한 번씩 고르게 등장한다.
const ROUNDS = [
  // ---- 제1장 · 만세는 끝나지 않았다 ----
  { num:1, chapter:1, chapterName:'제1장 · 만세는 끝나지 않았다', year:'1919년 4월 말, 만세의 함성이 잦아든 뒤',
    title:'식지 않은 열기',
    text:'함성은 잦아들었지만 사람들의 눈빛은 여전히 뜨겁습니다. 마을 어른들이 모여 앞으로의 일을 의논합니다. 당신이라면 먼저 어떤 말을 꺼내겠습니까?',
    choices:[
      {label:'"먼저 학교와 회사를 세워 스스로의 힘부터 기릅시다."', desc:'당장의 성과보다 오래갈 힘을 먼저 생각한다.', route:'sil',
        gain:'차근차근 쌓아가는 민족의 기반', lose:'지금 이 순간의 뜨거운 열기'},
      {label:'"지금의 열기가 식기 전에 사람들을 모아 행동에 나섭시다."', desc:'지금 이 순간, 함께할 사람을 모으는 일이 먼저라고 느낀다.', route:'daejung',
        gain:'지금 당장 함께할 수 있는 힘', lose:'오래 버틸 수 있는 기반'},
    ]},
  { num:2, chapter:1, chapterName:'제1장 · 만세는 끝나지 않았다', year:'같은 해 늦가을',
    title:'국경 너머에서 온 소식',
    text:'국외에서 뜻을 함께할 동지들이 모이고 있다는 소식이 들려옵니다. 그들에게 전할 말을 고른다면, 당신은 무엇을 전하겠습니까?',
    choices:[
      {label:'"무기를 마련하고 군대를 조직하여 정면으로 맞서야 합니다."', desc:'정면으로 맞설 힘을 갖추는 것이 먼저라고 믿는다.', route:'mujang',
        gain:'정면으로 맞설 조직된 힘', lose:'준비에 걸리는 긴 시간'},
      {label:'"소수라도 좋으니, 결정적인 한 방을 준비합시다."', desc:'많은 수보다 하나의 결행이 더 크게 흔들 수 있다고 느낀다.', route:'uiyeol',

// 선택한 노선에 +3, 역사적으로 맞닿은 인접 노선(SECONDARY)에 +1을 누적한다.
function computeScores(){
  const scores = {};
  Object.keys(ROUTES).forEach(k=> scores[k]=0);
  ROUNDS.forEach((r,i)=>{
    const sel = state.selections[i];
    if (sel===null || sel===undefined) return;
    const route = r.choices[sel].route;
    if (!route) return; // 보너스 문항(route 없음)은 결과 노선 계산에서 제외
    if (r.flatScore) { scores[route] += 1; return; } // 12번 문항: 선택한 노선에 1점만 추가
    scores[route] += 3;
    const sec = SECONDARY[route];
    if (sec) scores[sec] += 1;
  });
  return scores;
}

// 점수 내림차순 정렬 + 공동 1위(동점) 처리.
function getResultInfo(){
  const scores = computeScores();
  const sorted = Object.keys(scores).sort((a,b)=> scores[b]-scores[a]);
  const topScore = scores[sorted[0]];
  const winners = sorted.filter(k=> scores[k]===topScore);
  return { scores, sorted, winners };
}

// 가중치 없이, 학생이 실제로 각 노선을 '몇 번 선택했는지'만 센다.
// (보너스 문항인 11번은 route가 없어 자동 제외되고, 나머지 11개 문항이 대상이 된다)
function computePickCounts(){
  const counts = {};
  Object.keys(ROUTES).forEach(k=> counts[k]=0);
  ROUNDS.forEach((r,i)=>{
    const sel = state.selections[i];
    if (sel===null || sel===undefined) return;
    const route = r.choices[sel].route;
    if (!route) return;
    counts[route] += 1;
  });
  return counts;
}

// 선택 횟수를 바탕으로 "당신은 ~ 선택을 N번 했습니다" 형태의 자연어 분석 문단을 만든다.
function buildAnalysisText(){
  const counts = computePickCounts();
  const ranked = Object.keys(counts)
    .filter(k=> counts[k] > 0)
    .sort((a,b)=> counts[b]-counts[a]);

  if (ranked.length===0) return '';

  const parts = ranked.map(k=> `${ROUTE_PICK_PHRASE[k]} 선택을 <b>${counts[k]}번</b>`);
  let sentence;
  if (parts.length===1){
    sentence = `당신은 ${parts[0]} 했습니다.`;
  } else {
    sentence = `당신은 ${parts.slice(0,-1).join(', ')}, 그리고 ${parts[parts.length-1]} 했습니다.`;
  }

  let closeCallLine = '';
  if (ranked.length >= 2){
    const gap = counts[ranked[0]] - counts[ranked[1]];
    if (gap <= 1){
      closeCallLine = `<p>당신의 선택은 특히 「${PERSONAS[ranked[0]].short}」과(와) 「${PERSONAS[ranked[1]].short}」 사이에서 많이 흔들렸습니다.</p>`;
    }
  }

  return `<p>${sentence}</p>${closeCallLine}`;
}

    <div class="m-right">${rightLabel||''}</div>
  </div>`;
}

function renderProgress(){
  let dots = '';
  for(let i=0;i<ROUNDS.length;i++){
    let cls = '';
    if (state.screen==='result') cls='done';
    else if (state.screen==='chapterEnd') cls = (i <= state.roundIdx) ? 'done' : '';
    else if (i < state.roundIdx) cls = 'done';
    else if (i === state.roundIdx) cls = 'now';
    dots += `<span class="${cls}"></span>`;
    if (i%3===2 && i!==ROUNDS.length-1) dots += `<span class="chapter-gap"></span>`;
  }
  return `<div class="progress">${dots}</div>`;
}

function screenRound(){

  const isFinale = !!r.flatScore; // 12번 문항: 가방에 물건 하나를 넣는 특별한 화면

  const choices = r.choices.map((c,i)=>{
    if (isFinale){
      return `
    <button class="choice bag-item ${sel===i?'selected':''}" data-idx="${i}">
      <span class="b-icon">${c.icon||''}</span>
      <span class="c-body"><b>${c.label}</b><span>${c.desc}</span></span>

    return `

    </button>`;
  }).join('');

  // 선택 직후 보여주는 짧은 서사적 피드백. 실제 점수 계산과 반드시 일치할 필요는 없으며,
  // 학생이 선택의 역사적 의미(무엇을 얻고, 무엇을 내려놓았는지)를 이해하도록 돕는 요소다.
  let feedback = '';

    if (isFinale){
      feedback = `<div class="bag-toast">가방에 '${c.label}'을(를) 넣었습니다.</div>`;

}

    <textarea class="reflect" id="consInput" placeholder="이 노선의 약점을 작성해 보세요">${state.cons}</textarea>
  </div>

  <div class="bridge">앞으로는 이 여러 갈래의 길이 1920년대 실제 역사 속에서 어떻게 펼쳐졌는지 함께 살펴봅니다.</div>

  ${submitBlock}

  <div class="small-nav">
    <button class="btn secondary btn-small" id="prevBtn">이전</button>
    <button class="btn secondary btn-small" id="restartBtn">처음부터 다시</button>
  </div>
  <footer class="credit">단원 도입 활동 · © 2026. 한백고 이태형</footer>
  `;
}

/* ============================ RENDER + EVENTS ============================ */

function render(){
  const app = document.getElementById('app');
  let html = '';
  if (state.screen==='intro') html = screenIntro();
  else if (state.screen==='round') html = screenRound();
  else if (state.screen==='chapterEnd') html = screenChapterEnd();
  else if (state.screen==='result') html = screenResult();
  app.innerHTML = html;
  bindEvents();
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}

function bindEvents(){
  const startBtn = document.getElementById('startBtn');
  if (startBtn) startBtn.addEventListener('click', onStart);

  const studentIdInput = document.getElementById('studentIdInput');
  if (studentIdInput) studentIdInput.addEventListener('input', (e)=>{ state.studentId = e.target.value; });

  const studentNameInput = document.getElementById('studentNameInput');
  if (studentNameInput) studentNameInput.addEventListener('input', (e)=>{ state.studentName = e.target.value; });

  // 선택지를 누르면 즉시 다음으로 넘어가지 않고, 선택 상태만 표시한다.
  document.querySelectorAll('.choice').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.idx,10);
      state.selections[state.roundIdx] = idx;
      render();
    });
  });

  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.addEventListener('click', onNext);

  const continueBtn = document.getElementById('continueBtn');
  if (continueBtn) continueBtn.addEventListener('click', onContinueFromChapterEnd);

  const prevBtn = document.getElementById('prevBtn');
  if (prevBtn) prevBtn.addEventListener('click', onPrev);

  const restartBtn = document.getElementById('restartBtn');
  if (restartBtn) restartBtn.addEventListener('click', resetGame);

  const prosInput = document.getElementById('prosInput');
  if (prosInput) prosInput.addEventListener('input', (e)=>{ state.pros = e.target.value; });

  const summaryInput = document.getElementById('summaryInput');
  if (summaryInput) summaryInput.addEventListener('input', (e)=>{ state.summary = e.target.value; });

  const consInput = document.getElementById('consInput');
  if (consInput) consInput.addEventListener('input', (e)=>{ state.cons = e.target.value; });

  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) submitBtn.addEventListener('click', onSubmit);
}

/* ============================ SUBMIT (Google Sheets) ============================ */

function onSubmit(){
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('submitStatus');

  if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.indexOf('PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') !== -1){
    if (statusEl) statusEl.textContent = '⚠ 아직 구글 시트 연동 주소가 설정되지 않았습니다. (GAS_WEB_APP_URL)';
    return;
  }

  const { scores, winners } = getResultInfo();
  const payload = {
    timestamp: new Date().toISOString(),
    studentId: state.studentId,
    studentName: state.studentName,
    route: winners.map(w=>ROUTES[w].label).join(', '),
    scores: scores,
    summary: state.summary,
    pros: state.pros,
    cons: state.cons,
  };

  if (submitBtn){ submitBtn.disabled = true; submitBtn.textContent = '제출 중...'; }
  if (statusEl) statusEl.textContent = '';

  fetch(GAS_WEB_APP_URL, {
    method:'POST',
    mode:'no-cors',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(()=>{
    state.submitted = true; // 중복 제출 방지: 성공 후 화면이 확인 카드로 바뀌고 제출 버튼이 사라진다.
    render();
  }).catch(()=>{
    if (submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '제출하기'; }
    if (statusEl) statusEl.textContent = '⚠ 제출 중 오류가 발생했습니다. 다시 시도해 주세요.';
  });
}

function onStart(){
  const id = (state.studentId||'').trim();
  const name = (state.studentName||'').trim();
  const errorEl = document.getElementById('idFormError');

  if (!id || !name){
    if (errorEl) errorEl.textContent = '학번과 이름을 모두 입력해 주세요.';
    const target = !id ? document.getElementById('studentIdInput') : document.getElementById('studentNameInput');
    if (target) target.focus();
    return;
  }

  state.studentId = id;
  state.studentName = name;
  state.screen='round';
  state.roundIdx=0;
  render();
}

function onNext(){
  const sel = state.selections[state.roundIdx];
  if (sel===null || sel===undefined) return; // 안전장치: 선택 없이는 진행 불가

  document.querySelectorAll('.choice').forEach(b=> b.setAttribute('disabled','true'));
  const nextBtnEl = document.getElementById('nextBtn');
  if (nextBtnEl) nextBtnEl.setAttribute('disabled','true');

  const overlay = document.getElementById('stampOverlay');
  overlay.classList.remove('show');
  void overlay.offsetWidth;
  overlay.classList.add('show');

  setTimeout(()=>{
    if (state.roundIdx < ROUNDS.length-1){
      const finishedChapter = ROUNDS[state.roundIdx].chapter;
      const nextChapter = ROUNDS[state.roundIdx+1].chapter;
      // 챕터가 바뀌는 경계에서, 다음 문항으로 바로 넘어가지 않고 짧은 전환 화면을 먼저 보여준다.
      if (nextChapter !== finishedChapter && CHAPTER_ENDS[finishedChapter]){
        state.screen='chapterEnd';
        state.chapterEndOf = finishedChapter;
      } else {
        state.roundIdx += 1;
        state.screen='round';
      }
    } else {
      state.screen='result';
    }
    render();
  }, 550);
}

// 챕터 전환 화면에서 '이어가기'를 누르면 다음 챕터의 첫 문항으로 넘어간다.
function onContinueFromChapterEnd(){
  state.roundIdx += 1;
  state.screen='round';
  state.chapterEndOf = null;
  render();
}

function onPrev(){
  if (state.screen==='result'){
    state.screen='round';
    state.roundIdx = ROUNDS.length-1;
    render();
    return;
  }
  if (state.screen==='chapterEnd'){
    // 전환 화면은 roundIdx를 아직 올리지 않은 상태이므로, 그대로 해당 문항으로 되돌아간다.
    state.screen='round';
    state.chapterEndOf = null;
    render();
    return;
  }
  if (state.screen==='round'){
    if (state.roundIdx===0){
      state.screen='intro';
    } else {
      state.roundIdx -= 1;
    }
    render();
  }
}

function resetGame(){
  state.screen='intro';
  state.roundIdx=0;
  state.chapterEndOf=null;
  state.selections=new Array(ROUNDS.length).fill(null);
  state.summary='';
  state.pros='';
  state.cons='';
  state.submitted=false;
  render();
}

render();
</script>
</body>
</html>
